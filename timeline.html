<title>Agnes</title>
<style>
:root{--bg:#fafbfc;--card:#fff;--ink:#14171b;--soft:#616a74;--faint:#98a1ab;--line:#e2e6ea;
--ag:#15559e;--agbg:#eaf2fb;--zi:#8a5510;--zibg:#fbf3e6;
--red:#c0392b;--redbg:#fceeeb;--green:#1c7a5a;--greenbg:#e7f4ef;--amb:#8a5a10;--ambbg:#faf2e2;--greybg:#eff1f4;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1115;--card:#161a20;--ink:#e9edf1;
--soft:#98a2ad;--faint:#69727c;--line:#272e36;--ag:#6fa9dd;--agbg:#121e2b;--zi:#d9a458;--zibg:#231b0f;
--red:#e58369;--redbg:#2c1c17;--green:#5fae90;--greenbg:#14231e;--amb:#d3a04a;--ambbg:#282116;--greybg:#1c2128;}}
:root[data-theme="dark"]{--bg:#0e1115;--card:#161a20;--ink:#e9edf1;--soft:#98a2ad;--faint:#69727c;
--line:#272e36;--ag:#6fa9dd;--agbg:#121e2b;--zi:#d9a458;--zibg:#231b0f;--red:#e58369;--redbg:#2c1c17;
--green:#5fae90;--greenbg:#14231e;--amb:#d3a04a;--ambbg:#282116;--greybg:#1c2128;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:400 16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:24px 26px 56px}
.hdr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px}
h1{font-size:21px;font-weight:700;margin:0}
.hdr .q{font-size:15px;color:var(--soft)}
.hdr .now{margin-left:auto;font:700 23px ui-monospace,SFMono-Regular,Menlo,monospace;
 font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:13px;color:var(--faint);margin:0 0 12px}

/* ===== timeline ===== */
.tl{position:relative;height:500px;user-select:none;touch-action:none;cursor:ew-resize;
 border-radius:10px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.tl:focus-visible{outline:3px solid var(--ag);outline-offset:3px}
.band{position:absolute;left:0;right:0;z-index:0}
.band.a{top:0;height:200px;background:linear-gradient(180deg,transparent,var(--agbg))}
.band.z{top:202px;bottom:0;background:linear-gradient(180deg,var(--zibg),transparent)}
.who{position:absolute;left:15px;font:700 11px ui-sans-serif;letter-spacing:.14em;
 text-transform:uppercase;z-index:1}
.who.a{top:12px;color:var(--ag)}
.who.z{bottom:12px;color:var(--zi)}
.axis{position:absolute;left:0;right:0;top:200px;height:2px;background:var(--line);z-index:2}
.mon{position:absolute;top:207px;transform:translateX(-50%);font:11px ui-monospace,Menlo,monospace;
 color:var(--faint);z-index:2}
/* playhead: faint line behind the labels, plus a white handle on the axis */
.head{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.18;z-index:1;pointer-events:none}
.knob{position:absolute;top:184px;left:0;width:22px;height:22px;margin-left:-11px;border-radius:50%;
 background:#fff;border:3px solid var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.35);
 z-index:6;pointer-events:none;transition:transform .1s ease}
.tl:active .knob{transform:scale(1.12)}

.mk{position:absolute;top:0;height:500px;width:0;z-index:3;pointer-events:none}
.mk .pin{position:absolute;left:-5px;width:10px;height:10px;border-radius:50%}
.mk.a .pin{top:190px;background:var(--ag)}
.mk.z .pin{top:190px;background:var(--zi)}
.mk .stem{position:absolute;left:0;width:1px;background:var(--line)}
.mk .box{position:absolute;width:134px;padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.34;
 border:1px solid var(--line);background:var(--card)}
.mk .box .dt{display:block;font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.04em;
 opacity:.72;margin-bottom:3px}
.mk.a .box{border-color:var(--ag);color:var(--ag)}
.mk.z .box{border-color:var(--zi);color:var(--zi)}
.mk.future{opacity:.15}
.mk.future .box{visibility:hidden}

/* ===== gap block ===== */
.gaps{margin-top:28px}
h2{font:700 11.5px ui-sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.gap{display:grid;grid-template-columns:200px 1fr 210px;gap:16px;align-items:center;
 padding:12px 0;border-bottom:1px solid var(--line)}
.gap:last-child{border-bottom:none}
.gap .side{font-size:13.5px;line-height:1.3}
.gap .side .dt{display:block;font:700 10px ui-monospace,Menlo,monospace;opacity:.72;margin-bottom:2px}
.gap .l{color:var(--ag);text-align:right}
.gap .r{color:var(--zi)}
.gap .bar{position:relative;height:32px}
.gap .track{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--line)}
.gap .fill{position:absolute;left:0;top:8px;height:16px;border-radius:3px;
 background:repeating-linear-gradient(135deg,var(--redbg),var(--redbg) 5px,transparent 5px,transparent 10px);
 border:1.5px solid var(--red);transition:width .2s ease}
.gap .num{position:absolute;top:5px;font:700 14px ui-monospace,Menlo,monospace;color:var(--red);
 white-space:nowrap;transition:left .2s ease}
.gap.pending .fill{border-style:dashed;background:none}
.gap.idle{opacity:.25}
.gap.idle .num{color:var(--faint)}

/* ===== beliefs ===== */
.low{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin-top:30px}
@media(max-width:900px){.low{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:8px;background:var(--card);
 border:1px solid var(--line);margin-bottom:6px}
.row .w{flex:1;font-size:14.5px}
.row .t{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.t.bad{background:var(--redbg);color:var(--red)}.t.warn{background:var(--ambbg);color:var(--amb)}
.t.good{background:var(--greenbg);color:var(--green)}.t.none{background:var(--greybg);color:var(--faint)}
.row .o{font-size:12px;color:var(--faint);width:92px;text-align:right;flex-shrink:0}
.row .o.only{color:var(--ag);font-weight:700}
.verd{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:15px 17px;margin-bottom:12px}
.verd.alarm{border-color:var(--red);background:var(--redbg)}
.verd .h{font-size:18px;font-weight:700}.verd.alarm .h{color:var(--red)}
.verd .s{font-size:13.5px;color:var(--soft);margin-top:2px}
.note{font-size:13px;color:var(--soft);background:var(--card);border:1px solid var(--line);
 border-left:3px solid var(--ag);border-radius:6px;padding:11px 13px}
.note b{color:var(--ink)}
</style>

<div class="wrap">
  <div class="hdr"><h1>Agnes</h1><span class="q">Should Zillow keep buying homes?</span>
    <span class="now" id="now"></span></div>
  <p class="hint">Drag the timeline. Agnes above the line, Zillow below.</p>

  <div class="tl" id="tl" tabindex="0" role="slider" aria-label="Time" aria-valuemin="0" aria-valuemax="364">
    <div class="band a"></div><div class="band z"></div>
    <div class="who a">Agnes</div><div class="who z">Zillow</div>
    <div class="head" id="head"></div><div class="knob" id="knob"></div>
    <div class="axis"></div><div id="months"></div><div id="marks"></div>
  </div>

  <div class="gaps"><h2>After Agnes flagged it, how long until Zillow reacted</h2><div id="gapblock"></div></div>

  <div class="low">
    <div><h2>What has to be true</h2><div id="beliefs"></div></div>
    <div><h2>Agnes says</h2>
      <div class="verd" id="verd"><div class="h" id="vh"></div><div class="s" id="vs"></div></div>
      <div class="note" id="note"></div></div>
  </div>
</div>

<script>
const T0=new Date("2020-12-01"),T1=new Date("2021-11-30"),SPAN=(T1-T0)/864e5;
const dn=s=>Math.round((new Date(s)-T0)/864e5), pc=s=>dn(s)/SPAN*100;
const nice=s=>new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const addD=n=>new Date(T0.getTime()+n*864e5).toISOString().slice(0,10);

const A=[{id:"F",t:"We can predict resale prices"},{id:"T",t:"We can renovate and resell fast enough"},
{id:"U",t:"We make money on each home"},{id:"L",t:"We can offload homes if the market turns"},
{id:"C",t:"We can afford to keep buying"},{id:"D",t:"People want instant cash offers"}];

const E=[{d:"2020-02-19",x:null,o:"co",b:{L:-2,T:-1}},{d:"2020-12-29",x:"2021-01-26",o:"w",b:{D:1,F:-1}},
{d:"2021-01-13",x:"2021-07-14",o:"w",b:{T:-2,U:-1}},{d:"2021-01-22",x:"2021-07-22",o:"w",b:{D:2,F:-1}},
{d:"2021-01-26",x:"2021-07-27",o:"w",b:{D:1,F:-1}},{d:"2021-02-04",x:null,o:"w",b:{D:1}},
{d:"2021-02-10",x:null,o:"co",b:{U:-2,D:2,C:2}},{d:"2021-02-12",x:null,o:"co",b:{L:-1}},
{d:"2021-05-11",x:null,o:"w",b:{U:1,F:-2,T:-1}},{d:"2021-07-14",x:null,o:"w",b:{T:-2,U:-1}},
{d:"2021-07-22",x:null,o:"w",b:{D:2,F:-2}},{d:"2021-07-27",x:null,o:"w",b:{D:1,F:-2}},
{d:"2021-07-30",x:null,o:"w",b:{D:-1}},{d:"2021-08-05",x:null,o:"co",b:{T:-1,D:2,L:-2,C:-2}}];

const AG=[{d:"2021-01-13",t:"Resell speed in doubt",lane:0},
 {d:"2021-02-10",t:"Losing money per home",lane:1},
 {d:"2021-05-11",t:"Price prediction in trouble",lane:0,fire:1},
 {d:"2021-07-27",t:"Prices beyond anything the model knows",lane:1,fire:1},
 {d:"2021-08-05",t:"STOP AND REASSESS",lane:0,fire:1}];
const ZI=[{d:"2021-02-10",t:"“Investing aggressively”",lane:0},
 {d:"2021-02-12",t:"Annual report filed",lane:1},
 {d:"2021-08-05",t:"Bought more than they sold",lane:0},
 {d:"2021-10-18",t:"Pauses buying — blames capacity",lane:2},
 {d:"2021-11-02",t:"Shuts it down — blames price prediction",lane:1}];
const G=[{a:"2021-01-13",at:"Resell speed in doubt",z:"2021-10-18",zt:"Pauses buying, blames capacity"},
 {a:"2021-05-11",at:"Price prediction in trouble",z:"2021-11-02",zt:"Shuts it down, blames price prediction"},
 {a:"2021-08-05",at:"STOP AND REASSESS",z:"2021-10-18",zt:"Pauses buying"}];
const MAXG=Math.max(...G.map(g=>(new Date(g.z)-new Date(g.a))/864e5));

let cur=dn("2021-03-01");

document.getElementById("months").innerHTML=["2020-12-01","2021-01-01","2021-02-01","2021-03-01",
"2021-04-01","2021-05-01","2021-06-01","2021-07-01","2021-08-01","2021-09-01","2021-10-01","2021-11-01"]
.map(m=>"<div class='mon' style='left:"+pc(m)+"%'>"+new Date(m).toLocaleDateString("en-GB",{month:"short"})+"</div>").join("");

// AGNES  lane0 box top 108 (h~66) ; lane1 box top 24
// ZILLOW lane0 box top 226        ; lane1 box top 312
function box(m,k){
  const y = k==="a" ? (m.lane?24:108) : [226,312,398][m.lane];
  const stem = k==="a" ? "top:"+(y+66)+"px;height:"+(188-y-66)+"px"
                       : "top:202px;height:"+(y-202)+"px";
  const edge = pc(m.d)>88 ? "right:-6px" : "left:-8px";
  return "<div class='mk "+k+"' data-d='"+m.d+"' style='left:"+pc(m.d)+"%'>"+
   "<div class='stem' style='"+stem+"'></div><div class='pin'></div>"+
   "<div class='box' style='top:"+y+"px;"+edge+"'><span class='dt'>"+nice(m.d)+"</span>"+m.t+"</div></div>";
}
document.getElementById("marks").innerHTML=AG.map(m=>box(m,"a")).join("")+ZI.map(m=>box(m,"z")).join("");

document.getElementById("gapblock").innerHTML=G.map((g,i)=>
 "<div class='gap idle' data-i='"+i+"'>"+
 "<div class='side l'><span class='dt'>"+nice(g.a)+"</span>"+g.at+"</div>"+
 "<div class='bar'><div class='track'></div><div class='fill'></div><div class='num'></div></div>"+
 "<div class='side r'><span class='dt'>"+nice(g.z)+"</span>"+g.zt+"</div></div>").join("");

const live=(e,d)=>e.d<=d&&(!e.x||e.x>d);

function draw(){
  const d=addD(cur);
  document.getElementById("now").textContent=nice(d);
  const px=(cur/SPAN*100)+"%";
  document.getElementById("head").style.left=px;
  document.getElementById("knob").style.left=px;
  document.getElementById("tl").setAttribute("aria-valuetext",nice(d));
  document.querySelectorAll(".mk").forEach(el=>el.classList.toggle("future",el.dataset.d>d));

  document.querySelectorAll(".gap").forEach(el=>{
    const g=G[+el.dataset.i], f=el.querySelector(".fill"), n=el.querySelector(".num");
    if(d<g.a){el.className="gap idle";f.style.width="0";n.textContent="Agnes has not flagged this yet";n.style.left="0";return}
    const end=d<g.z?d:g.z, done=d>=g.z;
    const days=Math.round((new Date(end)-new Date(g.a))/864e5);
    el.className="gap"+(done?"":" pending");
    const w=days/MAXG*100;
    f.style.width=w+"%";
    n.textContent=done?(days+" days"):(days+" days so far");
    if(w>72){n.style.left="auto";n.style.right="calc("+(100-w)+"% + 10px)";
      n.style.color="var(--red)";n.style.background="transparent"}
    else{n.style.right="auto";n.style.left="calc("+w+"% + 10px)"}
  });

  let bad=0,worldOnlyF=false,html="";
  A.forEach(a=>{let n=0,v=0,co=0;
    E.forEach(e=>{const w=e.b[a.id];if(w===undefined||!live(e,d))return;n++;v+=w;if(e.o==="co")co++});
    let t,c;
    if(!n){t="nothing known";c="none"}else if(v>0){t="holding up";c="good"}
    else if(v===0){t="mixed";c="none"}else if(v>=-2){t="some doubt";c="warn"}
    else{t="in trouble";c="bad";bad++}
    if(a.id==="F"&&n&&!co)worldOnlyF=true;
    html+="<div class='row'><div class='w'>"+a.t+"</div><div class='t "+c+"'>"+t+
      "</div><div class='o"+(n&&!co?" only":"")+"'>"+(!n?"—":co?(n>co?"both":"Zillow only"):"world only")+"</div></div>";
  });
  document.getElementById("beliefs").innerHTML=html;

  const fired=d>="2021-08-05";
  document.getElementById("verd").className="verd"+(fired?" alarm":"");
  document.getElementById("vh").textContent=fired?"Stop and reassess":"Keep going — with conditions";
  document.getElementById("vs").textContent=fired
    ?"The $1bn inventory limit frozen in February has been crossed. "+bad+" of 6 in trouble."
    :bad+" of 6 in trouble. No pre-set limit crossed yet.";
  document.getElementById("note").innerHTML=worldOnlyF
    ?"<b>Zillow has never said anything</b> about whether it can predict resale prices — everything Agnes knows came from outside the company. That is the reason its CEO gave for shutting the business down."
    :"Drag forward to watch the evidence arrive.";
}

const tl=document.getElementById("tl");
const setX=cx=>{const r=tl.getBoundingClientRect();
 cur=Math.max(0,Math.min(SPAN,Math.round((cx-r.left)/r.width*SPAN)));draw()};
let down=false;
tl.addEventListener("pointerdown",e=>{down=true;tl.setPointerCapture(e.pointerId);setX(e.clientX)});
tl.addEventListener("pointermove",e=>{if(down)setX(e.clientX)});
tl.addEventListener("pointerup",()=>down=false);
tl.addEventListener("pointercancel",()=>down=false);
tl.addEventListener("keydown",e=>{const k={ArrowRight:1,ArrowLeft:-1,PageUp:14,PageDown:-14}[e.key];
 if(k){cur=Math.max(0,Math.min(SPAN,cur+k));draw();e.preventDefault()}
 if(e.key==="Home"){cur=0;draw();e.preventDefault()}
 if(e.key==="End"){cur=SPAN;draw();e.preventDefault()}});
draw();
</script>
